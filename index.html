    <script>
      // Pick light or dark from the visitor's local time before first paint (06:00-18:29 light).
      (function () {
        try {
          var o = sessionStorage.getItem('theme-override');
          var d = new Date(), m = d.getHours() * 60 + d.getMinutes();
          var dark = o ? o === 'dark' : (m < 360 || m >= 1110);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
